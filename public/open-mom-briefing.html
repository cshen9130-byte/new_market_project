<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOM 简报</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f3efe3; }
    #msg {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      font-family: sans-serif;
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <p id="msg">正在打开 MOM 简报…</p>
  <script>
    (function () {
      var msg = document.getElementById("msg")
      var raw = location.hash.replace(/^#/, "")
      if (!raw) {
        msg.textContent = "缺少登录信息，请从手机版 MOM 每日风控重新打开。"
        return
      }
      try {
        var user = JSON.parse(decodeURIComponent(raw))
        var id = String((user && user.id) || "").trim()
        if (!id || id.length > 80) throw new Error("bad")
        localStorage.setItem("currentUser", JSON.stringify({
          id: id,
          name: String(user.name || ""),
          email: String(user.email || ""),
          role: user.role,
          permissions: user.permissions
        }))
        try { sessionStorage.setItem("momEmbedBriefing", "1") } catch (e) {}
        // Top-level (no iframe). embed=1 is understood by the currently deployed Next bundle.
        location.replace("/ma/dashboard/mom-analysis/risk-report?tab=briefing&embed=1")
      } catch (e) {
        msg.textContent = "登录信息无法识别，请从手机版重新打开。"
      }
    })()
  </script>
</body>
</html>
