<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>母基金投研 · 手机预览</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: "Segoe UI", sans-serif;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { color: #d1d5db; font-size: 13px; }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      border: 12px solid #0b1220;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      background: #12100E;
      display: flex;
      flex-direction: column;
    }
    /* Simulated Huawei/Android status strip — MUST stay #12100E with light icons */
    .status {
      flex: 0 0 44px;
      height: 44px;
      background: #12100E;
      color: #F3E7D4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .status .right { display: flex; gap: 10px; align-items: center; opacity: 0.95; }
    .status .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #F3E7D4; display: inline-block;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #12100E;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">iPhone 尺寸预览 · 390 × 844 · status #12100E</div>
    <div class="phone" id="phone">
      <div class="status" id="statusStrip" data-expect="#12100E">
        <span>11:40</span>
        <span class="right"><span class="dot"></span><span>LTE</span><span>64%</span></span>
      </div>
      <iframe src="http://localhost:8081" title="母基金投研"></iframe>
    </div>
  </div>
</body>
</html>
