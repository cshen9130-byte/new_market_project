<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>母基金投研 · 手机预览</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      font-family: "Segoe UI", sans-serif;
    }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .label { color: #d1d5db; font-size: 13px; }
    .phone {
      width: 390px;
      height: 844px;
      border-radius: 36px;
      overflow: hidden;
      border: 12px solid #0b1220;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      background: #fff;
    }
    iframe { width: 100%; height: 100%; border: 0; background: #F3F0EA; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="label">iPhone 尺寸预览 · 390 × 844</div>
    <div class="phone">
      <iframe src="http://localhost:8081" title="母基金投研"></iframe>
    </div>
  </div>
</body>
</html>
